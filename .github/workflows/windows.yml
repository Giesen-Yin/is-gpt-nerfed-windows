name: Windows offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      NERFED_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline unit, integration and scorer parity
        run: python -m unittest discover -s tests -v
      - name: Core selftest
        run: python plugin/skills/is-gpt-nerfed/scripts/nerfed selftest
      - name: Install build dependencies
        if: matrix.python == '3.13'
        run: python -m pip install -r windows/requirements-build.txt
      - name: Build Windows executables (no account or inference)
        if: matrix.python == '3.13'
        run: python -m PyInstaller --noconfirm --workpath dist/build windows/IsGPTNerfed.spec
